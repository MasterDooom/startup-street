name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/startup_street npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
